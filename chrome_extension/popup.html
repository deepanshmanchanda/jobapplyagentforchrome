<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Application Bridge</title><link rel="stylesheet" href="popup.css"></head>
  <body>
    <h1>Application Bridge</h1>
    <p id="status">Pair this application tab once. Start Autopilot in the dashboard and it will continue in this same tab.</p>
    <button id="pair" type="button">Pair active tab</button>
    <button id="sync" type="button">Sync form snapshot</button>
